services:
  - type: web
    name: kavana-manufacturing-api
    runtime: node
    repo: https://github.com/your-org/kavana-manufacturing
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: kavana-redis
          property: connectionString

  - type: redis
    name: kavana-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []