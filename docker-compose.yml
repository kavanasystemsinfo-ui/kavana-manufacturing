# =============================================================================
# Kavana Manufacturing v3 — Stack completo (producción local)
#
# Servicios:
#   db        → PostgreSQL 16 (datos multi-tenant con RLS)
#   redis     → Redis 7 (colas BullMQ)
#   backend   → API NestJS (:3001)
#   worker    → Procesador BullMQ (oee-recalc, report-export)
#   frontend  → Nginx sirviendo React SPA (:80)
#
# Iniciar:
#   cp .env.example .env   # y rellenar REDIS_PASSWORD
#   docker compose up -d
#
# Los puertos publicados al host son configurables por variable de entorno,
# porque los valores por defecto (5433 y 80) pueden estar ocupados por otro
# servicio de la máquina. Ejemplo, si el 5433 ya está en uso:
#   DB_PORT=5434 docker compose up -d
# Ver .env.example para la lista completa.
#
# Observabilidad (opcional):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: kavana-v3-db
    environment:
      POSTGRES_USER: kavana
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kavana_v3_password}
      POSTGRES_DB: kavana_v3
    ports:
      # 127.0.0.1: Postgres no tiene que ser alcanzable desde la red; los
      # servicios de compose lo ven por la red interna (db:5432). El puerto del
      # host es configurable porque el 5433 por defecto puede estar ocupado.
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kavana -d kavana_v3']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kavana-v3-redis
    # FIX A2 (2026-08-21): Redis con password y SIN puerto publicado al host.
    # Antes: 6379 expuesto sin auth — cualquiera que alcanzara el puerto podía
    # inyectar jobs BullMQ con tenantId fijo y manipular datos de otros tenants.
    # Solo red interna de compose; REDIS_PASSWORD obligatorio en .env.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD required}']
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kavana-v3-backend
    ports:
      # Configurable: el 3001 puede estar ocupado en una máquina compartida.
      - '${BACKEND_PORT:-3001}:3001'
    environment:
      PORT: '3001'
      DATABASE_URL: postgresql://kavana:***@db:5432/kavana_v3
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      METRICS_PORT: '9464'
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      ALLOW_MOCK_AUTH: ${ALLOW_MOCK_AUTH:-false}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET:-kavana-hmac-dev-only}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kavana-v3-worker
    command: ['node', 'dist/worker.js']
    environment:
      DATABASE_URL: postgresql://kavana:***@db:5432/kavana_v3
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kavana-v3-frontend
    ports:
      # Configurable: el 80 suele estar ocupado por el nginx del host, que es
      # justo el caso de este VPS. Con FRONTEND_PORT=8080 el stack arranca sin
      # tocar el nginx que ya sirve las landings.
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
