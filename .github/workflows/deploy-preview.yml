name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  deploy-vercel-preview:
    name: Deploy Angular to Vercel Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Angular repository
        uses: actions/checkout@v4
        with:
          repository: your-org/kavana-warehouse-angular
          path: kavana-warehouse-angular

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kavana-warehouse-angular/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: /root/kavana-warehouse-angular

      - name: Build Angular
        run: npm run build
        working-directory: /root/kavana-warehouse-angular
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Preview
        run: |
          vercel --token=${{ secrets.VERCEL_TOKEN }} \
            --org=${{ secrets.VERCEL_ORG_ID }} \
            --project=${{ secrets.VERCEL_PROJECT_ID }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --prod=false
        working-directory: /root/kavana-warehouse-angular

      - name: Health check Vercel Preview
        run: |
          sleep 10
          PREVIEW_URL=$(vercel --token=${{ secrets.VERCEL_TOKEN }} --org=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID }} ls --scope=${{ secrets.VERCEL_ORG_ID }} --json | jq -r '.[0].url')
          echo "Preview URL: https://$PREVIEW_URL"
          curl -f "https://$PREVIEW_URL/health" || exit 1

  deploy-render-preview:
    name: Deploy NestJS to Render Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing

      - name: Install backend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/backend

      - name: Build backend
        run: npm run build
        working-directory: /root/kavana-manufacturing/backend

      - name: Deploy to Render Preview
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'

      - name: Wait for Render deployment
        run: |
          echo "Waiting for Render deployment to complete..."
          sleep 60
          # Poll for deployment status
          for i in {1..20}; do
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" | jq -r '.[0].status')
            echo "Deployment status: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "Deployment successful!"
              break
            elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
              echo "Deployment failed!"
              exit 1
            fi
            sleep 30
          done

      - name: Health check Render Preview
        run: |
          RENDER_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}" | jq -r '.url')
          echo "Render URL: $RENDER_URL"
          curl -f "$RENDER_URL/health" || exit 1

  comment-preview-urls:
    name: Comment Preview URLs on PR
    runs-on: ubuntu-latest
    needs: [deploy-vercel-preview, deploy-render-preview]
    if: always()
    steps:
      - name: Get Vercel Preview URL
        id: vercel-url
        run: |
          PREVIEW_URL=$(vercel --token=${{ secrets.VERCEL_TOKEN }} --org=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID }} ls --scope=${{ secrets.VERCEL_ORG_ID }} --json | jq -r '.[0].url')
          echo "url=https://$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Get Render Preview URL
        id: render-url
        run: |
          RENDER_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}" | jq -r '.url')
          echo "url=$RENDER_URL" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🚀 Preview Deployments\n\n' +
                '**Frontend (Vercel Preview):** ${{ steps.vercel-url.outputs.url }}\n\n' +
                '**Backend (Render Preview):** ${{ steps.render-url.outputs.url }}\n\n' +
                '---\n' +
                '*Health checks: Both services have `/health` endpoint verified.*'
            })