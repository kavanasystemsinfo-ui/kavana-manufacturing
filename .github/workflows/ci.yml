name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  NPM_VERSION: '10.8.2'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            .github/workflows/ci.yml

      - name: Install root dependencies
        run: npm ci

      - name: Verify frontend test file is clean
        run: |
          echo "=== Verifying imageCompress.spec.ts ==="
          head -50 frontend/src/utils/imageCompress.spec.ts
          echo "=== Raw bytes of lines 10-12 ==="
          sed -n '10,12p' frontend/src/utils/imageCompress.spec.ts | od -c
          echo "=== Raw bytes of lines 26-28 ==="
          sed -n '26,28p' frontend/src/utils/imageCompress.spec.ts | od -c
          echo "=== Raw bytes of lines 33-35 ==="
          sed -n '33,35p' frontend/src/utils/imageCompress.spec.ts | od -c
          echo "=== Running ESLint directly on file ==="
          npx eslint frontend/src/utils/imageCompress.spec.ts --format=json || true

      - name: Lint backend
        run: npm run lint
        working-directory: ./backend

      - name: Lint frontend
        run: npm run lint
        working-directory: ./frontend

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            .github/workflows/ci.yml

      - name: Install root dependencies
        run: npm ci

      - name: TypeCheck backend
        run: npx tsc --noEmit
        working-directory: ./backend

      - name: TypeCheck frontend
        run: npx tsc --noEmit
        working-directory: ./frontend

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kavana
          POSTGRES_PASSWORD: kavana_pass
          POSTGRES_DB: kavana_test
        ports: ['5432:5432']
        # needed because the postgres container does not emit a ready signal
        options: >-
          --health-cmd="pg_isready -U kavana -d kavana_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: ${{ env.NODE_VERSION }}
              cache: 'npm'
              cache-dependency-path: |
                package-lock.json
                backend/package-lock.json
                frontend/package-lock.json
                .github/workflows/ci.yml

          - name: Install root dependencies
            run: npm ci

          - name: Test backend
            env:
              DATABASE_URL: postgresql://kavana:kavana_pass@localhost:5432/kavana_test
            run: npm run test
            working-directory: ./backend

          - name: Test frontend
            run: npm run test
            working-directory: ./frontend

  docker-size:
    name: Docker Image Size
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            .github/workflows/ci.yml

      - name: Install root dependencies
        run: npm ci

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t kavana-manufacturing-backend:ci .

      - name: Check Docker image size
        id: image-size
        run: |
          SIZE_BYTES=$(docker image inspect kavana-manufacturing-backend:ci --format='{{.Size}}')
          echo "Image size in bytes: $SIZE_BYTES"
          MAX_BYTES=$((200 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "Error: Image size exceeds 200 MB"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            .github/workflows/ci.yml

      - name: Install root dependencies
        run: npm ci

      - name: Build backend
        run: npm run build
        working-directory: ./backend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: ./backend/dist
          retention-days: 1

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 1