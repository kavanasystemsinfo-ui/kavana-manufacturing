name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  NPM_VERSION: '10.8.2'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing

      - name: Install backend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/frontend

      - name: Lint backend
        run: npm run lint
        working-directory: /root/kavana-manufacturing/backend

      - name: Lint frontend
        run: npm run lint
        working-directory: /root/kavana-manufacturing/frontend

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing

      - name: Install backend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/frontend

      - name: TypeCheck backend
        run: npx tsc --noEmit
        working-directory: /root/kavana-manufacturing/backend

      - name: TypeCheck frontend
        run: npx tsc --noEmit
        working-directory: /root/kavana-manufacturing/frontend

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing

      - name: Install backend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/frontend

      - name: Test backend
        run: npm run test
        working-directory: /root/kavana-manufacturing/backend

      - name: Test frontend
        run: npm run test
        working-directory: /root/kavana-manufacturing/frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing

      - name: Install backend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: /root/kavana-manufacturing/frontend

      - name: Build backend
        run: npm run build
        working-directory: /root/kavana-manufacturing/backend

      - name: Build frontend
        run: npm run build
        working-directory: /root/kavana-manufacturing/frontend

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: /root/kavana-manufacturing/backend/dist
          retention-days: 1

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: /root/kavana-manufacturing/frontend/dist
          retention-days: 1

  angular-lint:
    name: Angular Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Angular repository
        uses: actions/checkout@v4
        with:
          repository: your-org/kavana-warehouse-angular
          path: kavana-warehouse-angular

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kavana-warehouse-angular/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: /root/kavana-warehouse-angular

      - name: Lint Angular
        run: npm run lint
        working-directory: /root/kavana-warehouse-angular

  angular-typecheck:
    name: Angular TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Angular repository
        uses: actions/checkout@v4
        with:
          repository: your-org/kavana-warehouse-angular
          path: kavana-warehouse-angular

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kavana-warehouse-angular/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: /root/kavana-warehouse-angular

      - name: TypeCheck Angular
        run: npx tsc --noEmit
        working-directory: /root/kavana-warehouse-angular

  angular-test:
    name: Angular Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Angular repository
        uses: actions/checkout@v4
        with:
          repository: your-org/kavana-warehouse-angular
          path: kavana-warehouse-angular

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kavana-warehouse-angular/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: /root/kavana-warehouse-angular

      - name: Test Angular
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: /root/kavana-warehouse-angular

  angular-build:
    name: Angular Build
    runs-on: ubuntu-latest
    needs: [angular-lint, angular-typecheck, angular-test]
    steps:
      - name: Checkout Angular repository
        uses: actions/checkout@v4
        with:
          repository: your-org/kavana-warehouse-angular
          path: kavana-warehouse-angular

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kavana-warehouse-angular/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: /root/kavana-warehouse-angular

      - name: Build Angular
        run: npm run build
        working-directory: /root/kavana-warehouse-angular

      - name: Upload Angular build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: /root/kavana-warehouse-angular/dist
          retention-days: 1